
spring.application.name=controlator-painel

# Carrega as credenciais locais do arquivo .env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/controlator_db
spring.datasource.username=controlator
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

controlator.bootstrap-admin.enabled=${CONTROLATOR_BOOTSTRAP_ADMIN_ENABLED:false}
controlator.bootstrap-admin.username=${CONTROLATOR_BOOTSTRAP_ADMIN_USERNAME:}
controlator.bootstrap-admin.email=${CONTROLATOR_BOOTSTRAP_ADMIN_EMAIL:}
controlator.bootstrap-admin.password=${CONTROLATOR_BOOTSTRAP_ADMIN_PASSWORD:}
