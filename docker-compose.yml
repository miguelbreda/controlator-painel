
services:
  postgres:
    image: postgres:17-alpine
    container_name: controlator-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: controlator_db
      POSTGRES_USER: controlator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

    ports:
      - "5432:5432"

    volumes:
      - controlator_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlator -d controlator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  controlator_data:
